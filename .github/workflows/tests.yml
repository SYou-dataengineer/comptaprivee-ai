name: Tests Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests automatisés
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra python3-tk xvfb

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Vérifier les langues OCR
        run: tesseract --list-langs

      - name: Exécuter les tests
        run: xvfb-run -a python -m pytest -v

  windows:
    name: Windows Python 3.12 - persistance et GUI
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances Python
        run: python -m pip install -r requirements.txt
      - name: Vérifier les dépendances
        run: python -m pip check
      - name: Vérifier Tk Windows
        run: python -c "import tkinter as tk; r=tk.Tk(); r.withdraw(); r.update(); r.destroy()"
      - name: Tester Windows - chemins, JSON, CSV, sauvegarde et GUI
        run: >-
          python -m pytest --capture=sys -q
          tests/test_release_platform.py
          tests/test_app_paths.py
          tests/test_windows_launcher.py
          tests/test_sqlite_lifecycle.py
          tests/test_tax_case.py
          tests/test_tax_case_storage.py
          tests/test_backup_manager.py
          tests/test_persistence_security.py
          tests/test_final_b2_inputs.py
          tests/test_csv_exporter.py
          tests/test_gui_block2.py
          tests/test_gui_case_identity.py
          tests/test_gui_final_b2_inputs.py
